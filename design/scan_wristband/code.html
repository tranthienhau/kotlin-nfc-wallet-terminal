            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        @keyframes nfc-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        .animate-nfc-pulse {
            animation: nfc-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .nfc-wave {
            border: 2px solid #0429ba;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        @keyframes ripple {
            0% { width: 80px; height: 80px; opacity: 0.8; }
            100% { width: 280px; height: 280px; opacity: 0; }
        }
        .animate-ripple {
            animation: ripple 3s linear infinite;
        }
        .ripple-delay-1 { animation-delay: 1s; }
        .ripple-delay-2 { animation-delay: 2s; }

        .scan-success-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<script>
        function simulateScan() {
            const scanContainer = document.getElementById('scan-container');
            const resultCard = document.getElementById('result-card');
            const animations = document.getElementById('nfc-animations');
            const mainIcon = document.getElementById('main-icon');
            const statusText = document.getElementById('scan-headline');
            const statusIconDiv = document.getElementById('status-icon');

            // Feedback: Change Icon & Animation
            animations.classList.add('hidden');
            mainIcon.innerText = 'check_circle';
            mainIcon.style.fontVariationSettings = "'FILL' 1";
            mainIcon.classList.remove('text-primary');
            mainIcon.classList.add('text-secondary');
            statusIconDiv.classList.add('bg-secondary/10', 'border-secondary');
            statusText.innerText = 'Scan Complete';

            setTimeout(() => {
                // Hide scanner, show results
                scanContainer.classList.add('opacity-0', '-translate-y-8');
                setTimeout(() => {
                    scanContainer.classList.add('hidden');
                    resultCard.classList.remove('hidden');
                    // Force reflow for animation
                    void resultCard.offsetWidth;
                    resultCard.classList.remove('opacity-0', 'translate-y-4');
                }, 300);
            }, 800);
        }

        function resetScanner() {
            location.reload();
        }

        // Haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
    </script>
